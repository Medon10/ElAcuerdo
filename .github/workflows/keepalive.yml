name: Keep Render Awake

on:
  schedule:
    # Disparar cada 15 minutos todo el día (UTC)
    # Filtramos por horario AR dentro del job para mayor confiabilidad.
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping only between 07:00–23:59 Argentina
        run: |
          AR_HOUR=$(TZ='America/Argentina/Buenos_Aires' date +%H)
          printf "Argentina hour: %s\n" "$AR_HOUR"
          if [ "$AR_HOUR" -lt 7 ]; then
            echo "Outside 07:00–23:59 AR window. Skipping ping.";
            exit 0
          fi
          curl -fsS https://elacuerdo.onrender.com/api/health > /dev/null
